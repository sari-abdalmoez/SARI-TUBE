name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepare APK signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Align, sign and verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          FINAL_APK="app/build/outputs/apk/debug/SARI-TUBE.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          ALIGNED_APK="$RUNNER_TEMP/SARI-TUBE-aligned.apk"

          test -s "$APK"

          "$BUILD_TOOLS/zipalign" -f -P 16 -v 4 "$APK" "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$FINAL_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL_APK"
          unzip -tq "$FINAL_APK"

          "$BUILD_TOOLS/aapt" dump badging "$FINAL_APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.sari.tube'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "sdkVersion:'29'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "targetSdkVersion:'35'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "native-code:.*arm64-v8a" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "native-code:.*armeabi-v7a" "$RUNNER_TEMP/apk-badging.txt"

          echo "APK signature and package structure verified"
          ls -lh "$FINAL_APK"

      - uses: actions/upload-artifact@v4
        with:
          name: SARI-TUBE-installable-apk
          path: app/build/outputs/apk/debug/SARI-TUBE.apk
          if-no-files-found: error
          retention-days: 7
